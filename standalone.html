<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxis Hub Reporting</title>
  <meta name="description" content="Galaxis Hub Reporting prototype: monthly SEM and SMM PDF reports for client workspaces.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Radio+Canada+Big:wght@400;500;700&display=swap">
  <script src="https://unpkg.com/lucide@0.546.0/dist/umd/lucide.min.js"></script>
  <style>
/* Galaxis Hub — design tokens and components, taken from the Figma "Product Hub" page */
:root {
  --primary: #398FF7;
  --primary-hover: #2E72C6;
  --primary-dark: #225694;
  --link: #0366D8;
  --tint: #ECF5FF;
  --blue-light: #66ACFD;

  --text: #2B2B2B;
  --text-secondary: #656565;
  --text-muted: #AEAEAE;
  --border: #DFDFDF;
  --border-light: #EAEAEA;
  --page: #FCFCFC;
  --surface: #FFFFFF;
  --grey-light: #F2F2F2;

  --success: #36A93F;
  --success-bg: #E7F7E8;
  --success-pill: #8CDA93;
  --warning: #F59E1B;
  --warning-bg: #FFF4E3;
  --warning-pill: #F9C576;
  --warning-dark: #C47E16;
  --error: #E4100E;
  --error-bg: #FDE3E3;
  --error-pill: #F78483;
  --info-pill: #66ACFD;

  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 99px;

  --shadow-soft: 0 0 10px rgba(43, 43, 43, .10);
  --shadow-light: 0 0 24px rgba(43, 43, 43, .06);

  --font-head: 'Radio Canada Big', system-ui, sans-serif;
  --font-body: 'Arimo', system-ui, sans-serif;

  --sidebar-w: 212px;
  --devbar-h: 44px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 20px;
  letter-spacing: .25px;
  color: var(--text);
  background: var(--page);
  padding-top: var(--devbar-h);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }

/* ---------- Typography ---------- */
.h-page { font-family: var(--font-head); font-weight: 700; font-size: 24px; line-height: 28px; color: var(--primary); margin: 0; }

.h-card { font-family: var(--font-head); font-weight: 700; font-size: 16px; line-height: 20px; letter-spacing: .5px; margin: 0; }

.t-caption { font-size: 12px; line-height: 16px; letter-spacing: .5px; }
.t-muted { color: var(--text-muted); }

.t-bold { font-weight: 700; }

.t-error { color: var(--error); }

/* ---------- Layout ---------- */
.app { display: flex; min-height: calc(100vh - var(--devbar-h)); }
.sidebar {
  position: fixed; top: var(--devbar-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background: var(--surface); box-shadow: var(--shadow-light);
  display: flex; flex-direction: column; padding: 24px 20px; z-index: 50;
}
.sidebar-logo { font-family: var(--font-head); font-size: 26px; font-weight: 500; letter-spacing: -.5px; color: var(--text); padding: 0 4px 18px; border-bottom: 1px solid var(--border); margin-bottom: 20px; display: flex; align-items: center; gap: 2px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md);
  color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: .5px; background: none; border: 0; text-align: left; width: 100%;
}
.nav-item:hover { background: var(--grey-light); color: var(--text-secondary); text-decoration: none; }
.nav-item.active { color: var(--primary); }

/* "Agency only" tag on a nav item inside a client workspace: client users can't see that page. */
.nav-tag { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: var(--r-pill); background: var(--grey-light); color: var(--text-secondary); font-size: 10px; letter-spacing: .2px; white-space: nowrap; }
.nav-tag svg.lucide { width: 11px; height: 11px; }
/* Pages outside this prototype: listed for context, not clickable. */
.nav-item.is-disabled, .nav-item.is-disabled:hover { color: var(--text-muted); opacity: .45; background: none; cursor: not-allowed; }
.sidebar-note { margin-top: auto; padding: 12px 4px 0; border-top: 1px solid var(--border); font-size: 11px; line-height: 16px; color: var(--text-secondary); }

.main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; padding: 32px 40px 64px; }
.main-inner { max-width: 1240px; margin: 0 auto; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.page-header .page-desc { color: var(--text-muted); font-size: 14px; margin-top: 6px; letter-spacing: .5px; }
.page-header-right { display: flex; align-items: center; gap: 14px; }
.avatar-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--text-muted); color: #fff; border: 0; display: grid; place-items: center; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--tint); color: var(--primary); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex-shrink: 0; }

.stack { display: flex; flex-direction: column; gap: 24px; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }

.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }

.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 24px; }

.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.card-sub { color: var(--text-muted); font-size: 12px; letter-spacing: .5px; margin-top: 6px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 16px; min-height: 124px; }
.kpi-title { display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .5px; color: var(--text); }
.kpi-value { font-family: var(--font-head); font-weight: 700; font-size: 24px; line-height: 28px; margin: 14px 0 12px; }
.kpi-sub { font-size: 12px; color: var(--text-secondary); letter-spacing: .5px; }
.kpi-sub b { color: var(--primary); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px;
  border-radius: var(--r-pill); font-weight: 700; font-size: 14px; letter-spacing: .1px; border: 1.5px solid transparent; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: var(--surface); color: var(--primary); border-color: var(--primary); }
.btn-outline:hover { background: var(--tint); }

.btn-danger { background: var(--error); color: #fff; }
.btn-danger:hover { background: #A40C0A; }

.btn:disabled, .btn.disabled { background: var(--grey-light); color: var(--text-muted); border-color: var(--grey-light); cursor: not-allowed; }

.kebab { width: 28px; height: 28px; border-radius: 50%; border: 0; background: none; display: inline-grid; place-items: center; color: var(--text); }
.kebab:hover { background: var(--grey-light); }

/* ---------- Tabs ---------- */
.page-tabs { display: flex; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
.page-tab { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; border: 0; background: none; color: var(--text-muted); font-weight: 700; font-size: 14px; border-bottom: 2px solid transparent; }
.page-tab:hover { color: var(--text-secondary); }
.page-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ---------- Pills, chips, dots ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 96px; height: 22px; padding: 0 12px; border-radius: var(--r-pill); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.pill-green { background: var(--success-pill); }
.pill-blue { background: var(--info-pill); }
.pill-red { background: var(--error-pill); }

.pill-grey { background: var(--text-muted); }
.pill-sm { min-width: 0; height: 20px; padding: 0 10px; font-size: 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 12px; border-radius: var(--r-pill); background: var(--tint); color: var(--blue-light); font-size: 11px; letter-spacing: .25px; white-space: nowrap; }
.chip-outline { background: var(--surface); border: 1px solid var(--border); color: var(--text); height: 28px; padding: 0 10px; font-size: 12px; }

.chip-remove { border: 0; background: none; padding: 0; color: inherit; display: inline-flex; }
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.dot-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-green { background: var(--success-pill); } .dot-green-strong { background: var(--success); }
.dot-blue { background: var(--primary); }
 .dot-orange-strong { background: var(--warning); }
 .dot-red-strong { background: var(--error); }
.dot-grey { background: var(--text-muted); }

  

/* ---------- Banners ---------- */
.banner { display: flex; align-items: center; gap: 14px; border-radius: var(--r-md); padding: 14px 18px; border: 1px solid; }
.banner-warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning-dark); }
.banner-warning .banner-title { color: var(--warning); }
.banner-error { background: var(--error-bg); border-color: var(--error-pill); color: #A40C0A; }

.banner-title { font-weight: 700; font-size: 14px; }
.banner-text { font-size: 12px; letter-spacing: .25px; }
.banner .banner-action { margin-left: auto; font-weight: 700; font-size: 12px; text-decoration: underline; background: none; border: 0; color: inherit; white-space: nowrap; }
.banner svg.lucide { width: 20px; height: 20px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-size: 12px; color: var(--text-secondary); letter-spacing: .5px; }
.field-label .req { color: var(--error); margin-left: 2px; }
.input, .select, .textarea {
  height: 38px; width: 100%; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface);
  padding: 0 12px; font-size: 14px; outline: none; letter-spacing: .25px;
}
.textarea { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--text-muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(57, 143, 247, .15); }
.input.invalid { border-color: var(--error); }
.field-error { color: var(--error); font-size: 12px; }
.field-hint { color: var(--text-muted); font-size: 12px; }
.input:disabled, .select:disabled { background: var(--grey-light); color: var(--text-muted); }
.search { position: relative; }
.search .input { padding-right: 34px; height: 36px; font-size: 12px; }
.search svg.lucide { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 14px; height: 14px; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--primary); margin: 0; }
.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: var(--border); border-radius: 10px; transition: .15s; cursor: pointer; }
.toggle span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; }
.toggle input:checked + span { background: var(--primary); }
.toggle input:checked + span::before { transform: translateX(16px); }

.form-section-title { font-size: 12px; font-weight: 400; letter-spacing: .5px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin: 24px 0 20px; }

/* ---------- Tables ---------- */
.table-wrap { border: 1px solid var(--border); border-radius: var(--r-md); overflow-x: auto; }
/* Tables: the body font (Arimo) as in the Figma tables, 13px with the same open tracking as the KPI card text (.5px). */
.table { width: 100%; border-collapse: collapse; font-size: 13px; letter-spacing: .5px; }
.table th { background: var(--tint); text-align: left; font-weight: 700; padding: 12px 14px; white-space: nowrap; font-size: 13px; }
.table td { padding: 14px; border-top: 1px solid var(--border-light); vertical-align: middle; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: #F8FBFF; }
.table td.num, .table th.num { text-align: right; }
.table .cell-sub { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.th-sort { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-weight: 700; font-size: 12px; cursor: pointer; }
.th-sort .sort-ind { color: var(--text-muted); font-size: 11px; }
.th-sort.sorted .sort-ind { color: var(--primary); }
/* Action column pinned to the right edge (tables marked by markActionColumns() in core.js).
   :where() keeps specificity low so row states (hover, pending, muted) still colour the cell. */
:where(.table.has-action-col) tr > :last-child { position: sticky; right: 0; z-index: 2; background: var(--surface); }
:where(.table.has-action-col) thead tr > :last-child { background: var(--tint); }
/* While more columns are hidden behind the action column (.is-overflowing without .at-end): a fade over the
   scrolling columns, a divider and a stronger shadow. They disappear once the table is scrolled to the end. */
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col tr > :last-child { box-shadow: -10px 0 12px -10px rgba(43, 43, 43, .28), inset 1px 0 0 var(--border); }
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col tr > :last-child::before {
  content: ''; position: absolute; top: 0; bottom: 0; right: 100%; width: 48px; pointer-events: none;
  background: linear-gradient(to right, rgba(255, 255, 255, 0), var(--surface));
}
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col thead tr > :last-child::before { background: linear-gradient(to right, rgba(236, 245, 255, 0), var(--tint)); }
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col tr.clickable:hover > :last-child::before { background: linear-gradient(to right, rgba(248, 251, 255, 0), #F8FBFF); }
:where(.table.has-action-col) tr > :last-child.menu-open-cell { z-index: 60; }
/* First column pinned to the left edge of every table. Once scrolled (.is-scrolled), a divider, shadow and
   fade show that columns are passing underneath it. */
:where(.table-wrap > .table) tr > :first-child:not([colspan]) { position: sticky; left: 0; z-index: 2; background: var(--surface); }
:where(.table-wrap > .table) thead tr > :first-child:not([colspan]) { background: var(--tint); }
:where(.table-wrap.is-scrolled) > .table tr > :first-child:not([colspan]) { box-shadow: 10px 0 12px -10px rgba(43, 43, 43, .28), inset -1px 0 0 var(--border); }
:where(.table-wrap.is-scrolled) > .table tr > :first-child:not([colspan])::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 100%; width: 48px; pointer-events: none;
  background: linear-gradient(to left, rgba(255, 255, 255, 0), var(--surface));
}
:where(.table-wrap.is-scrolled) > .table thead tr > :first-child::after { background: linear-gradient(to left, rgba(236, 245, 255, 0), var(--tint)); }
:where(.table-wrap.is-scrolled) > .table tr.clickable:hover > :first-child::after { background: linear-gradient(to left, rgba(248, 251, 255, 0), #F8FBFF); }
.table-empty { text-align: center; padding: 40px 16px !important; color: var(--text-muted); }
.table-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.table-toolbar .search { width: 260px; }
.pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; font-size: 12px; }
.pagination .per-page { display: inline-flex; align-items: center; gap: 6px; }
.pagination select { border: 0; border-bottom: 1px solid var(--text); background: none; font-size: 12px; padding: 0 2px; }
.pagination .pages { display: inline-flex; align-items: center; gap: 4px; }
.page-btn { min-width: 28px; height: 28px; border: 0; background: none; border-radius: 50%; font-size: 12px; color: var(--text); display: inline-grid; place-items: center; }
.page-btn.muted { color: var(--text-muted); }
.page-btn.active { background: var(--tint); color: var(--primary); font-weight: 700; }
.page-btn:disabled { color: var(--border); cursor: default; }

/* Compact headers: multi-word column names sit on two balanced lines (thLabel in core.js), never more (table.table-wrap-heads). */
.table.table-wrap-heads thead tr:last-child th { white-space: normal; vertical-align: bottom; line-height: 15px; }
.table.table-wrap-heads thead tr:last-child th .th-sort { text-align: left; align-items: flex-end; }
.table.table-wrap-heads thead tr:last-child th .th-line { display: block; white-space: nowrap; }
.table.table-wrap-heads thead tr:last-child th .th-sort .sort-ind { white-space: nowrap; }

/* ---------- Collapsible column groups (colGroupHeaderRow in core.js) ---------- */
/* Tones: neutral (account / details), ads + ads2 (alternating ad groups), seo, crm. */
/* One colour for every group band, deeper than the column-header tint so the two rows read apart; tone classes
   are kept on cells but no longer change the colour. Group dividers: 2px, a soft mid blue. */
.table { --colgrp-bg: #D2E5FD; --colgrp-fg: #0356B8; --colgrp-line: #A8CDFB; }

/* A band widens its columns only a little (labels up to 180px); longer labels end in "…". */

/* ---------- Platform badges ---------- */
.platform { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-pill); font-size: 12px; background: var(--surface); }

.logo { width: 16px; height: 16px; display: inline-block; flex-shrink: 0; }

/* ---------- Dropdowns / menus ---------- */
.menu-anchor { position: relative; display: inline-block; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 200px; background: var(--surface); border-radius: var(--r-md);
  box-shadow: var(--shadow-soft); padding: 6px; z-index: 400; display: none;
}
.menu.open { display: block; }

.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; font-size: 12px; letter-spacing: .5px; }
.menu-item:hover { background: var(--grey-light); }
.menu-item.danger { color: var(--error); }
.menu-item:disabled { color: var(--text-muted); cursor: not-allowed; background: none; }
.menu-sep { height: 1px; background: var(--border-light); margin: 4px 0; }

/* ---------- Workspace switcher ---------- */
.ws-trigger { display: inline-flex; align-items: center; gap: 10px; min-width: 260px; height: 36px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 12px; letter-spacing: .5px; }
.ws-trigger .chev { margin-left: auto; }
.ws-panel { position: absolute; right: 0; top: calc(100% + 8px); width: 420px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-soft); padding: 18px; z-index: 500; display: none; }
.ws-panel.open { display: block; }
.ws-section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; margin: 14px 0 8px; }
.ws-option { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid transparent; background: none; padding: 10px; border-radius: var(--r-md); text-align: left; }
.ws-option:hover { background: var(--grey-light); }
.ws-option.current { border-color: var(--primary); background: var(--tint); }
.ws-option .ws-name { font-weight: 700; font-size: 14px; }
.ws-option .ws-meta { font-size: 12px; color: var(--text-muted); }
.ws-list { max-height: 320px; overflow-y: auto; }

/* ---------- Modals & drawers ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(252, 252, 252, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 24px; }
.modal-backdrop.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-soft); width: 100%; max-width: 500px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 24px; }
.modal-lg { max-width: 640px; }
.modal-title { font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 24px; margin: 0; }
.modal-desc { font-size: 14px; color: var(--text); margin: 6px 0 22px; letter-spacing: .25px; }
.modal-body { display: flex; flex-direction: column; gap: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
.modal-actions.center { justify-content: center; }
.modal-confirm { text-align: center; max-width: 500px; padding: 32px 36px; }
.modal-confirm .confirm-icon { color: var(--warning); margin-bottom: 18px; }
.modal-confirm .confirm-icon.danger { color: var(--error); }
.modal-confirm .confirm-icon svg.lucide { width: 52px; height: 52px; stroke-width: 2; }
.modal-confirm .modal-desc { color: var(--text-muted); margin-bottom: 0; }

/* ---------- Toast ---------- */

// ---------- Screen URLs ----------
// Every screen and state has its own link: #/<workspace id | agency>/<page>?<params>, plus state=… (the States
// toggles, see devToggleQuery). The hash follows each render; opening
// a link or using Back / Forward restores that screen and state.
function routeHash() {
  const q = new URLSearchParams();
  Object.entries(state.params || {}).forEach(([k, v]) => { if (v != null && v !== '' && typeof v !== 'object') q.set(k, v); });
  const toggles = devToggleQuery();
  if (toggles) q.set('state', toggles);
  const qs = q.toString();
  return `#/${state.ctx || 'agency'}/${state.page}${qs ? `?${qs}` : ''}`;
}
let urlReplace = true;   // replace (not push) while opening a link, so a corrected link doesn't add a Back step
function syncUrl() {
  const hash = routeHash();
  if (location.hash === hash) return;
  try { history[urlReplace ? 'replaceState' : 'pushState'](null, '', hash); } catch (e) { /* sandboxed frames may block history */ }
}
// Apply a link's hash. Returns false when there is no route in it.
function applyRoute(hash) {
  const m = /^#\/([^/?]+)\/([^/?]+)(?:\?(.*))?$/.exec(hash || '');
  if (!m) return false;
  const q = new URLSearchParams(m[3] || '');
  const ws = m[1] !== 'agency' ? wsById(decodeURIComponent(m[1])) : null;
  state.ctx = ws ? ws.id : null;
  const params = {};
  q.forEach((v, k) => { if (k !== 'state') params[k] = v; });
  const page = decodeURIComponent(m[2]);
  urlReplace = true;
  navigate(screens[page] ? page : 'reports', params);
  devApplyToggleQuery(q.get('state'));
  syncUrl();
  urlReplace = false;
  return true;
}
window.addEventListener('popstate', () => { if (location.hash !== routeHash()) applyRoute(location.hash); });

// ---------- Menus & popovers ----------
// Markup: <div class="menu-anchor"><button onclick="toggleMenu('id', event)">…</button><div class="menu" id="id">…</div></div>
function toggleMenu(id, ev) {
  if (ev) ev.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  closeAllPopovers();
  if (wasOpen) return;
  el.classList.add('open');
  el.closest('td, th')?.classList.add('menu-open-cell');
  // Menus inside scrollable tables would be clipped: pin them to the viewport next to their trigger.
  const trigger = ev && ev.currentTarget;
  if (trigger && el.closest('.table-wrap')) {
    const r = trigger.getBoundingClientRect();
    const h = el.offsetHeight, w = el.offsetWidth;
    const top = r.bottom + 6 + h > window.innerHeight ? Math.max(8, r.top - 6 - h) : r.bottom + 6;
    Object.assign(el.style, { position: 'fixed', top: `${top}px`, left: `${Math.max(8, r.right - w)}px`, right: 'auto', bottom: 'auto' });
  }

// ---------- Sorting & pagination ----------
// sortHeader('tableId', 'col', 'Label', 'rerenderFn') -> clickable header; applySort(list, 'tableId', { col: item => value })
function sortHeader(table, col, label, fn) {
  const s = state.sorts[table] || {};
  const on = s.col === col;
  const ind = on ? (s.dir === 'asc' ? '↑' : '↓') : '↑↓';
  return `<button type="button" class="th-sort ${on ? 'sorted' : ''}" onclick="toggleSort('${table}','${col}','${fn}')">${thLabel(label)}<span class="sort-ind">${ind}</span></button>`;
}
// Header label split into two balanced lines. Shown on one line normally; in tables with .table-wrap-heads each
// line becomes a block that never wraps, so a header takes at most two rows (e.g. "Contract Days / Left").
function thLabel(label) {
  const words = String(label).split(' ');
  if (words.length < 2) return `<span class="th-label">${esc(label)}</span>`;
  let best = 1, bestLen = Infinity;
  for (let i = 1; i < words.length; i++) {
    const len = Math.max(words.slice(0, i).join(' ').length, words.slice(i).join(' ').length);
    if (len < bestLen) { best = i; bestLen = len; }
  }
  return `<span class="th-label"><span class="th-line">${esc(words.slice(0, best).join(' '))}</span> <span class="th-line">${esc(words.slice(best).join(' '))}</span></span>`;
}
function toggleSort(table, col, fn) {
  const s = state.sorts[table] || {};
  state.sorts[table] = { col, dir: s.col === col && s.dir === 'desc' ? 'asc' : 'desc' };
  if (state.pagers[table]) state.pagers[table].page = 1;
  window[fn]();
}
function applySort(list, table, accessors, fallback) {
  const s = state.sorts[table] || fallback;
  if (!s || !accessors[s.col]) return list;
  const get = accessors[s.col];
  return [...list].sort((a, b) => {
    const va = get(a), vb = get(b);
    const cmp = typeof va === 'number' && typeof vb === 'number' ? va - vb : String(va).localeCompare(String(vb));
    return s.dir === 'asc' ? cmp : -cmp;
  });
}
function pager(table, perPage = 10) {

}
function paginate(list, table, perPage) {

  const pages = Math.max(1, Math.ceil(list.length / p.perPage));

  return list.slice((p.page - 1) * p.perPage, p.page * p.perPage);
}

function paginationBar(table, total, fn) {
  const p = pager(table);
  const pages = Math.max(1, Math.ceil(total / p.perPage));
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - p.page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  const opts = [10, 20, 50].map(n => `<option value="${n}" ${n === p.perPage ? 'selected' : ''}>${n}</option>`).join('');
  return `<div class="pagination">
    <span class="per-page">Showing Per Page: <select onchange="setPerPage('${table}', this.value, '${fn}')">${opts}</select>
      <span class="t-muted">&nbsp;· ${total ? `${(p.page - 1) * p.perPage + 1}–${Math.min(total, p.page * p.perPage)} of ${total}` : '0 results'}</span></span>
    <span class="pages">
      <button type="button" class="page-btn" ${p.page <= 1 ? 'disabled' : ''} onclick="setPage('${table}', ${p.page - 1}, '${fn}')" aria-label="Previous"><i data-lucide="chevron-left"></i></button>
      ${nums.map(n => n === '…' ? '<span class="page-btn muted">…</span>' : `<button type="button" class="page-btn ${n === p.page ? 'active' : 'muted'}" onclick="setPage('${table}', ${n}, '${fn}')">${n}</button>`).join('')}
      <button type="button" class="page-btn" ${p.page >= pages ? 'disabled' : ''} onclick="setPage('${table}', ${p.page + 1}, '${fn}')" aria-label="Next"><i data-lucide="chevron-right"></i></button>
    </span></div>`;
}
function setPage(table, n, fn) { pager(table).page = n; window[fn](); }

// ---------- Pinned first and action columns ----------
// The first column of every table is pinned by CSS; this marks action columns and the scroll state.

    const head = table.querySelector('thead tr:last-child > :last-child');   // the column-name row, not a group band row
    const rows = [...table.querySelectorAll('tbody tr')].filter(r => r.children.length > 1);
    const explicit = !!head && (/action/i.test(head.textContent) || /action/i.test(head.className));

// ---------- Toggle states in screen links ----------
// A screen link carries its States toggles as ?state=<slug>,…: a slug for an on/off toggle turned on, <slug>-off for one
// turned off, and the full slug of a cycle button's current label ("seo-status-critical"). Only toggles that differ
// from a fresh load are listed, so each state has one link.
const devToggleDefaults = {};

const devLinkBaseline = {};

  const fn = devToggleRegistry[screenKey()];

}

function devRecordToggleDefaults() {
  const saved = { ctx: state.ctx, page: state.page, params: state.params, flags: state.flags };
  state.flags = { ...state.flags, ...devLinkBaseline };
  [null, ...workspaces.map(w => w.id)].forEach(ctx => {
    Object.entries(devToggleRegistry).forEach(([key, fn]) => {
      if (key.startsWith('agency-') !== (ctx === null)) return;
      state.ctx = ctx;
      try {
        fn().filter(t => t !== 'sep' && !t.action).forEach(t => {
          devToggleDefaults[`${key}|${ctx}|${t.cycle ? devCycleName(t.label) : devSlug(t.label)}`] = t.cycle ? devSlug(t.label) : !!t.active;

}
function devToggleDefault(t) {
  const k = `${screenKey()}|${state.ctx}|${t.cycle ? devCycleName(t.label) : devSlug(t.label)}`;

  return devToggleDefaults[k];
}
function devToggleQuery() {
  return devScreenToggles().map(t => {
    const def = devToggleDefault(t);
    if (t.cycle) return devSlug(t.label) === def ? null : devSlug(t.label);
    return !!t.active === def ? null : `${devSlug(t.label)}${t.active ? '' : '-off'}`;

function devApplyToggleQuery(value) {

  for (let n = 0; n < 20; n++) {
    const t = devScreenToggles().find(t => {
      if (t.cycle) { const hit = [...want].find(w => w.startsWith(devCycleName(t.label) + '-')); return hit && hit !== devSlug(t.label); }
      const s = devSlug(t.label);
      const on = want.has(s) ? true : want.has(`${s}-off`) ? false : devToggleDefault(t);
      return !!t.active !== on;
    });
    if (!t) return;
    t.run();
  }
}

// =====================================================================
// Mock performance data — generated per workspace, deterministic from ws.seed
// =====================================================================
const ADS_CAMPAIGNS = {
  google: ['Search Campaign', 'Display Remarketing', 'Performance Max', 'Brand Search', 'YouTube Awareness', 'Demand Gen Prospecting', 'App Installs'],
  meta: ['Paid Social Campaign', 'Lead Gen - Instant Forms', 'Retargeting - Site Visitors', 'Awareness Reach', 'Advantage+ Catalogue', 'Page Engagement Boost', 'App Install Campaign']
};
const ADS_ADGROUPS = {
  google: ['Search - Brand Exact', 'Search - Non Brand Broad', 'Display - Cart Abandoners', 'Retargeting - 30D Visitors', 'In-Market Audiences', 'Competitor Terms'],
  meta: ['Lookalike 1%', 'Interest - Decision Makers', 'Retargeting - 30D Engagers', 'Broad - Advantage+', 'Custom Audience - CRM List', 'Video Viewers 50%']

function adsPickStatus(rnd, limitedBias) {

    adsShuffle(ADS_CAMPAIGNS[p], rnd).slice(0, ws.allCampaigns ? ADS_CAMPAIGNS[p].length : 2 + Math.floor(rnd() * 2)).forEach((cName, ci) => {

            id, level: 'ad', platform: p, name: `Ad Creative Q${Math.ceil(adNo / 2)} - Variant ${adNo}`, format: fmt, ...adsStatusFields(status),
            parents: [cName, gName], campaignName: cName, adGroupName: gName,

    return `<h2 class="rep-h2">${esc(b.title)}${ci ? ' <span class="rep-cont">(continued)</span>' : ''}</h2><div class="rep-sub">${esc(sub)}</div>
      <table class="rep-table ${b.rows === 'convType' ? 'rep-table-compact' : ''} ${cols.length >= 16 ? 'rep-table-wide rep-table-xwide rep-table-xxwide' : cols.length >= 12 ? 'rep-table-wide rep-table-xwide' : cols.length >= 9 ? 'rep-table-wide' : ''}">${head}<tbody>${chunk.map(r => `<tr class="${r.sub ? 'rep-subrow' : ''}"><td>${repRowCell(wsId, r, b)}</td>${cols.map(c => `<td class="${c.t === 'text' || c.t === 'status' ? '' : 'num'}">${cell(r, c)}</td>`).join('')}</tr>`).join('')}
      ${last ? `<tr class="rep-total"><td>${b.limit && all.length > b.limit ? `Total, all ${all.length} ${noun[1]}` : 'Total'}</td>${cols.map(c => `<td class="${c.t === 'text' || c.t === 'status' ? '' : 'num'}">${cell(total, c, true)}</td>`).join('')}</tr>` : ''}</tbody></table>`;
  });
}
// Left out of a real report: tables with no rows that month (e.g. no Performance Max campaigns ran), and a section

function repLiveBlocks(wsId, blocks, month) {

// r: { wsId (the client), type, month, cfg, sample }. A sample uses made-up names over the sample workspace's numbers.
function repPages(r) {
  const ws = wsById(r.wsId), t = REP_TYPES[r.type], am = memberById(r.cfg?.owner || CURRENT_USER_ID);
  const data = r.sample ? repSampleWs() : r.wsId, month = r.month;
  repSampling = !!r.sample;
  try {
    const pages = [];
    const plats = repTypeSources(r.type).filter(p => repHas(r.wsId, p));
    pages.push({ cover: true, html: `<div class="rep-cover">
        <div class="rep-cover-brand">galaxis</div>
        <div class="rep-cover-main">${r.sample ? '<div class="rep-sample-flag">Sample data: made-up names and numbers</div>' : ''}<div class="rep-cover-kicker">Monthly ${esc(t.name)}</div><div class="rep-cover-client">${esc(ws.name)}</div><div class="rep-cover-month">${esc(repMonthLabel(month))}</div>
          <div class="rep-cover-plats">${plats.map(p => `<span class="rep-cover-plat">${platformLogo(p)}${REP_PLATFORM[p]}</span>`).join('')}</div></div>
        <div class="rep-cover-foot">Prepared by ${esc(am ? am.name : AGENCY_ORG.name)}, ${esc(AGENCY_ORG.name)} · Generated ${esc(fmtDate(repSendDate(month)))}</div>
      </div>` });
    let slots = [], head = '';
    const flush = () => { if (slots.length || head) pages.push({ html: head + slots.join('') }); slots = []; head = ''; };
    repLiveBlocks(data, repBlocks(r.wsId, r.cfg, r.type), month).forEach(b => {
      if (b.kind === 'text') { flush(); head = `<div class="rep-section"><h2 class="rep-section-title">${esc(b.title)}</h2>${b.note ? `<p class="rep-section-note">${esc(b.note)}</p>` : ''}</div>`; }
      else if (b.kind === 'chart') {
        // Summary cards need no title: each card names its number.
        slots.push(`<section class="rep-slot ${b.chart === 'summary' ? 'rep-slot-cards' : ''}">${b.chart === 'summary' ? '' : `<h2 class="rep-h2">${esc(b.title)}</h2><div class="rep-sub">${esc(repChartSub(b, month, data))}</div>`}<div class="rep-chart">${repChartBody(data, b, month)}</div></section>`);
        if (slots.length === 2) flush();
      } else {
        if (slots.length) flush();
        repTablePages(data, b, month, !!head).forEach((html, i) => pages.push({ html: (i ? '' : head) + html }));
        head = '';
      }
    });
    flush();
    const n = pages.length;
    return pages.map((pg, i) => pg.cover ? `<div class="rep-page rep-page-cover">${pg.html}</div>` : `<div class="rep-page">
        <div class="rep-page-head"><span>${esc(ws.name)} · Monthly ${esc(t.name)}</span>${r.sample ? '<span class="rep-sample-tag">Sample data</span>' : ''}<span>${esc(repMonthLabel(month))}</span></div>
        <div class="rep-page-body">${pg.html}</div>
        <div class="rep-page-foot"><span>galaxis</span><span>Page ${i + 1} of ${n}</span></div>
      </div>`);

}

// ---------- Sent Reports ----------
function repHistoryHTML(ws, cfg) {
  const list = repHistory(ws.id), next = repNextMonth(cfg), status = repStatus(ws.id);
  // A failed email whose reports have all been regenerated is Ready to send.
  const ready = h => h.status === 'failed' && !repStillFailing(h).length;
  const pill = h => ready(h) ? `${repPill('scheduled', 'Ready to send')}<div class="cell-sub">Every report is generated. Send the email when ready.</div>`
    : h.status === 'failed' ? repPill('failed', 'Failed') : repPill('sent', 'Sent');
  return `<section class="card"><div class="card-header"><div><h2 class="h-card">Sent Reports</h2><div class="card-sub">Every monthly email, with the PDFs exactly as they were sent. A failed email is tried again daily for 3 days before it shows here as Failed.</div></div></div>
    <div class="table-wrap"><table class="table rep-history">
      <thead><tr><th>Report Month</th><th>Reports</th><th>Status</th><th>Sent</th><th>Recipients</th><th></th></tr></thead>
      <tbody>
        ${repUpcomingRow(ws, cfg, next, status)}
        ${list.map(h => `<tr><td>${esc(repMonthLabel(h.month))}</td><td>${repTypeChips(h.types)}</td><td>${pill(h)}${h.reason && !ready(h) ? `<div class="cell-sub rep-wrap-text rep-reason">${esc(h.shortReason || h.reason)}</div>` : ''}</td><td>${h.sentAt ? esc(fmtDateTime(h.sentAt)) : '<span class="t-muted">Not sent</span>'}</td>
          <td><span title="${esc(h.to.join(', '))}">${h.to.length}</span></td>
          <td>${repHistoryActions(h)}</td></tr>`).join('')}
        ${list.length ? '' : '<tr><td colspan="6" class="table-empty">No reports have been sent yet.</td></tr>'}
      </tbody></table></div></section>`;
}
// Sent Reports actions in three fixed columns, so they line up on every row: SEM, SMM, then the send action.
function repActionCells(cells) { return `<div class="rep-actions">${cells.map(c => `<div>${c || ''}</div>`).join('')}</div>`; }
// The next report's row in Sent Reports: Month in progress (nothing to review yet), Scheduled (review period, with
// Preview and Cancel send), Cancelled, or Inactive.
function repUpcomingRow(ws, cfg, next, status) {
  const types = repTypesOn(ws.id, cfg), review = status === 'active' && repInReview(cfg), cancelled = review && repCancelled(cfg);
  const from = fmtDate(new Date(repAddMonths(next, 1) + '-01T00:00:00'));
  const pill = status === 'inactive' ? repPill('off', 'Not scheduled')
    : cancelled ? repPill('failed', 'Cancelled')
    : review ? repPill('review', 'Ready for review')
    : repPill('off', 'Month in progress');
  // Preview is the call-out while the report is waiting to be sent; before the month ends there is nothing to preview.
  const preview = kind => REP_TYPE_IDS.map(t => types.includes(t) ? `<button type="button" class="btn ${kind} btn-sm" onclick="repOpenSent('${t}', '${next}')"><i data-lucide="eye"></i>Preview ${esc(REP_TYPES[t].short)}</button>` : '');
  const actions = status === 'inactive' ? '' : !review ? `<div class="rep-actions"><span class="t-muted rep-not-ready">${esc(`Preview from ${from}`)}</span></div>`
    : cancelled ? repActionCells([...preview('btn-outline'), `<button type="button" class="btn btn-outline btn-sm" onclick="repResume()"><i data-lucide="undo-2"></i>Resume send</button>`])
    : repActionCells([...preview('btn-primary'), `<button type="button" class="btn btn-outline btn-sm" onclick="repCancelSend()"><i data-lucide="ban"></i>Cancel send</button>`]);
  return `<tr class="rep-upcoming"><td>${esc(repMonthLabel(next))}</td><td>${repTypeChips(types)}</td><td>${pill}</td><td>${status === 'inactive' || cancelled ? '<span class="t-muted">Not scheduled</span>' : esc(fmtDateTime(repSendDate(next)))}</td><td>${cfg.to.length}</td><td>${actions}</td></tr>`;
}
function repCancelSend() {
  const cfg = repConfig(state.ctx), next = repNextMonth(cfg), types = repTypesOn(state.ctx, cfg);
  confirmDialog({ title: `Cancel the ${repMonthLabel(next)} send?`, text: `The ${repJoin(types.map(t => REP_TYPES[t].name))} for ${repMonthLabel(next)} won’t be sent on ${fmtDateTime(repSendDate(next))}. You can resume the send before then, or send them later from Sent Reports.`, confirmLabel: 'Cancel send', danger: true, icon: 'ban',
    onConfirm: () => { cfg.skip = next; rerender(); showToast(`${repMonthLabel(next)} send cancelled`, 'ban'); } });
}
function repResume() {
  const cfg = repConfig(state.ctx), next = repNextMonth(cfg);
  cfg.skip = null;
  rerender();
  showToast(`${repMonthLabel(next)} reports will be sent on ${fmtDateTime(repSendDate(next))}`, 'undo-2');
}
// A sent email: View each report, Resend email. A failed one: Retry each report that couldn't be generated (View the
// others), then Send email once nothing is still failing.
function repHistoryActions(h) {
  const failing = h.status === 'failed' ? repStillFailing(h) : [];
  const view = t => `<button type="button" class="btn btn-outline btn-sm" onclick="repOpenSent('${t}', '${h.month}')"><i data-lucide="eye"></i>View ${esc(REP_TYPES[t].short)}</button>`;
  const cells = REP_TYPE_IDS.map(t => !h.types.includes(t) ? '' : failing.includes(t)
    ? `<button type="button" class="btn btn-primary btn-sm" onclick="repRetry('${h.id}', '${t}')"><i data-lucide="refresh-cw"></i>Retry ${esc(REP_TYPES[t].short)}</button>` : view(t));
  const send = h.status === 'failed'
    ? `<button type="button" class="btn ${failing.length ? 'btn-outline' : 'btn-primary'} btn-sm" ${failing.length ? `disabled title="Retry the ${esc(repJoin(failing.map(t => REP_TYPES[t].short)))} Report first"` : ''} onclick="repSendEmail('${h.id}')"><i data-lucide="send"></i>Send email</button>`
    : `<button type="button" class="btn btn-outline btn-sm" onclick="repSendEmail('${h.id}')"><i data-lucide="send"></i>Resend email</button>`;
  return repActionCells([...cells, send]);
}
// Regenerate one report of a failed email (mock: it now succeeds).
function repRetry(id, type) {
  const h = repHistory(state.ctx).find(x => x.id === id);
  repRetried[id] = [...new Set([...(repRetried[id] || []), type])];
  rerender();
  showToast(`${REP_TYPES[type].name} for ${repMonthLabel(h.month)} regenerated${repStillFailing(h).length ? '' : '. The email is ready to send'}`, 'refresh-cw');

function repSendEmail(id) {
  const ws = wsById(state.ctx), cfg = repConfig(state.ctx), list = repHistories[state.ctx], h = repHistory(state.ctx).find(x => x.id === id);
  const types = h.types.length ? h.types : repTypesOn(ws.id, cfg);
  confirmDialog({ title: `${h.status === 'failed' ? 'Send' : 'Resend'} the ${repMonthLabel(h.month)} email?`, text: `The ${repJoin(types.map(t => REP_TYPES[t].name))} ${types.length > 1 ? 'go' : 'goes'} to ${cfg.to.length} ${cfg.to.length === 1 ? 'recipient' : 'recipients'} of ${ws.name} now, with the agency members copied in.`, confirmLabel: 'Send now', icon: 'send',
    onConfirm: () => {
      const entry = { id: uid('rh'), month: h.month, sentAt: repToday().toISOString(), to: cfg.to.map(r => r.email), status: 'sent', types };
      const i = list.findIndex(x => x.id === id);

      state.flags.repFailed = false;
      rerender();
      showToast(`${repMonthLabel(h.month)} email sent to ${cfg.to.length} ${cfg.to.length === 1 ? 'recipient' : 'recipients'}`, 'send');

  const cfg = repConfig(state.ctx), month = sample ? repLastMonth() : state.params.preview;

  const sentMonths = repHistory(r.wsId).filter(h => h.status === 'sent' && h.types.includes(r.type)).map(h => h.month);
  const months = [...new Set([...sentMonths, ...(r.sample ? [] : [r.month])])].sort().reverse();

        <div class="rep-viewer-sub">${r.sample ? esc(`Made-up names and numbers, to check the sections and columns that are turned on. The real report uses ${ws.name}’s data.`) : r.upcoming ? esc(`Not sent yet: this is what recipients will get on ${fmtDateTime(repSendDate(r.month))}, with ${ws.name}’s data and the current set-up. Change sections, columns or recipients until then.`) : repHistory(r.wsId).some(h => h.month === r.month && h.status === 'failed') ? 'Generated, not sent yet: the email is held until every report in it has been generated.' : 'As sent. In the product this is the stored PDF; the prototype draws it again.'}</div></div>
      ${r.sample ? '' : `<select class="select rep-viewer-month" aria-label="Report month" onchange="state.params.preview = this.value; rerender()">${months.map(m => `<option value="${m}" ${m === r.month ? 'selected' : ''}>${esc(repMonthLabel(m))}</option>`).join('')}</select>`}
      <button type="button" class="btn btn-primary" onclick="repDownload()"><i data-lucide="download"></i>Download PDF</button>
      <button type="button" class="kebab rep-viewer-close" aria-label="Close preview" onclick="repClosePreview()"><i data-lucide="x"></i></button>
    </div>
    <div class="rep-viewer-scroll" id="rep-viewer-scroll"><div class="rep-pages" id="rep-pages">${repPages(r).join('')}</div></div>

// Pages are drawn at A4 size and zoomed to fit the viewer.
function repFitPages() {
  const s = document.getElementById('rep-viewer-scroll'), p = document.getElementById('rep-pages');
  if (s && p) p.style.zoom = Math.min(1, (s.clientWidth - 48) / 1123);
}
window.addEventListener('resize', repFitPages);
// "Download PDF" opens the browser's print dialog on the pages alone (Save as PDF), A4 landscape. Links stay clickable.
function repDownload() {
  const r = repViewArgs();
  const el = document.createElement('div');
  el.id = 'rep-print';
  el.innerHTML = repPages(r).join('');
  document.body.appendChild(el);
  document.body.classList.add('rep-printing');
  const done = () => { el.remove(); document.body.classList.remove('rep-printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  const title = document.title;
  document.title = repFileName(r.wsId, r.type, r.month).replace(/\.pdf$/, '') + (r.sample ? '_SAMPLE' : '');
  window.print();
  document.title = title;
  setTimeout(done, 500);
}

(function repSpecs() {

  const common = `
### Scope and audience
- **Agency only.** Account managers (AMs) set up each client's reports in Galaxis. Client users never see the Reports page; in Client user view the nav item is hidden and the route sends them to the Dashboard. Clients only receive the PDFs by email.
- **Two fixed reports per client:** the **SEM Report** (Google Ads) and the **SMM Report** (Facebook Page, Instagram and Meta Ads). Each has fixed sections in a fixed order, with fixed headings, charts and tables. Per client the AM can only turn a report on or off, turn sections on or off, and turn table columns on or off (column order is fixed). No templates and no custom headings (decided 20/11/2026).
- **Sources:** a section needs its source linked to the workspace. A section whose source isn't linked can't be turned on. Nothing from a CRM or other integration.
- **Permissions (agency roles, Team & Access › Agency › Monthly Reports):** View Reports, Set Up Reports (reports, sections, columns, schedule, recipients), Send Reports (resend). Account Manager has all three; Analyst can view.
- **Mock data:** the dashboard's platform data, scaled to the days in the report month; search terms split from keywords; posts, captions and followers generated per workspace. All names, captions and numbers are placeholders.`;
  const sources = `
### What the APIs give us (checked 20/11/2026)
- **Campaign types** come from \`campaign.advertising_channel_type\` (Search, Performance Max, Demand Gen, Video = YouTube, Display), so nothing needs tagging by hand.
- **Levels:** Google campaign, ad group, ad, keyword (\`keyword_view\`) and search term (\`search_term_view\`, Search campaigns only; Google hides low-volume terms for privacy, so search terms don't add up to the campaign). Meta campaign, ad set, ad. Performance Max has no ads: results are per asset group.
- **"Ran in the month"** = at least 1 impression between the 1st and the last day of the month. Neither ads API keeps a usable status history, so delivery decides. **Status** shows the status when the report is made.
- **Search ad text:** \`ad_group_ad.ad.responsive_search_ad\` gives every headline and description as written; Google mixes them, so the PDF shows the first three headlines and the first description with a note.
- **Links in the PDF are clickable** (Chrome / Puppeteer keep \`<a href>\` links when printing to PDF). Google: the ad's final URL (YouTube: the video). Meta: the ad's \`preview_shareable_link\` (to be checked: whether it still opens once the ad is off). Posts: Facebook \`permalink_url\`, Instagram \`permalink\`.
- **Thumbnails:** Google image asset or YouTube thumbnail; Meta creative thumbnail; posts \`full_picture\` / \`media_url\` / \`thumbnail_url\`. Downloaded and stored when the PDF is made, because Meta's image URLs expire. Search ads have no image.
- **Organic:** posts published in the month, with their lifetime results on the day the report is made. Instagram stories are left out: their insights are only available for 24 hours. Meta replaced impressions with **views** (Instagram from April 2025, Facebook Pages from November 2025, more Page metrics retired in v25.0, February 2026). Audience by age and gender (Instagram): accounts reached, from \`reached_audience_demographics\` with the age and gender breakdowns (not followers).
